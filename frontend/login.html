<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <!-- Update the src path to your actual logo image file -->
   <img src="amazon_logo.png" class="logo" alt="Amazon Logo">

    <div class="login-box">
        <h1>Login</h1>

        <label for="username">Email or mobile phone number</label>
        <input type="text" id="username">

        <div class="password-heading">
            <label for="password">Password</label>
            <a href="#">Forgot Password</a>
        </div>
        <input type="password" id="password">

        <button type="submit">Login</button>

        <div class="checkbox">
            <input type="checkbox" id="keep-signed-in">
            <label style="font-weight: normal;" for="keep-signed-in">Keep me signed in.</label>
            <a href="#">Details</a>
        </div>

        <div class="divider">
            <span>New to Amazon?</span>
        </div>

        <button type="button" class="create-btn">
            Create your Amazon account
        </button>

    </div>

    <div class="footer">
        <a href="#">Conditions of Use</a>
        <a href="#">Privacy Notice</a>
        <a href="#">Help</a>

        <p>© 1996-2017, Amazon.com, Inc. or its affiliates</p>
    </div>

</div>

</body>
</html>
